name: GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate release tag and source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be a stable vX.Y.Z tag." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Dispatch this release workflow from main." >&2
            exit 1
          fi
          VERSION="$(sed -nE 's/^version = "([^"]+)"$/\1/p' build.gradle.kts)"
          if [[ -z "$VERSION" || "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Tag must exactly match the stable Gradle project version (v$VERSION)." >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git checkout --detach "refs/tags/$RELEASE_TAG"
          git fetch --no-tags origin main
          if [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked out source does not match the requested tag." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tagged source must be reachable from main." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A GitHub Release for $RELEASE_TAG already exists; releases are not overwritten." >&2
            exit 1
          fi

      - name: Run tests and build plugin
        run: ./gradlew test buildPlugin verifyPluginStructure verifyPlugin

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" build/distributions/*.zip \
            --title "$RELEASE_TAG" \
            --notes "Install the ZIP in IntelliJ using Settings > Plugins > Install Plugin from Disk. See the repository README and user guide for compatibility and setup."
