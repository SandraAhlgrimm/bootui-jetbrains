name: Release plugin ZIP

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag to build and release (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Verify tag and project version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          tag_commit="$(git rev-parse --verify "$RELEASE_TAG^{commit}")"
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "The checkout does not match the requested tag." >&2
            exit 1
          fi
          project_version="$(./gradlew --no-daemon --quiet properties | sed -n 's/^version: //p')"
          if [[ ! "$project_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$RELEASE_TAG" != "v$project_version" ]]; then
            echo "Tag $RELEASE_TAG must match the stable Gradle project version $project_version." >&2
            exit 1
          fi
      - name: Test, build, and verify plugin
        run: ./gradlew --no-daemon test buildPlugin verifyPluginStructure verifyPlugin
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-plugin-zip
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: release-plugin-zip
          path: dist
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A GitHub release already exists for $RELEASE_TAG; refusing to overwrite it." >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.tag }}
          name: BootUI JetBrains ${{ inputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: dist/*.zip
